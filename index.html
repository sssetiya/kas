<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Penagihan Kas RT - Sampah 15k & Perelek 10k</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.22s ease-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 pb-24 select-none">

  <!-- Header Sticky -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-lg font-bold tracking-tight">Penagihan Kas RT</h1>
          <p class="text-xs text-emerald-100">Target 5 Minggu: Sampah 15rb • Perelek 10rb</p>
        </div>
        <button onclick="muatData()" class="bg-white/20 hover:bg-white/30 active:scale-95 transition px-3 py-1.5 rounded-lg text-xs font-semibold">
          ↻ Refresh
        </button>
      </div>

      <!-- Kas Hari Ini + Tombol Riwayat -->
      <div class="mt-3 bg-emerald-700/70 border border-emerald-500/40 rounded-xl p-3 flex justify-between items-center">
        <div>
          <span class="block text-[11px] font-medium text-emerald-100">Uang Terkumpul Hari Ini:</span>
          <span id="kasHariIni" class="text-lg font-extrabold tracking-wide">Rp0</span>
        </div>
        <button onclick="bukaRiwayat()" class="bg-white text-emerald-800 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm active:scale-95 transition">
          📋 Riwayat (<span id="countLog">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-md mx-auto p-4">
    <!-- Pencarian & Filter Status -->
    <div class="mb-3 space-y-2">
      <input
        type="text"
        id="searchInput"
        oninput="filterWarga()"
        placeholder="🔍 Cari nama warga atau blok rumah..."
        class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-base shadow-sm focus:outline-none focus:border-emerald-600"
      />
      <div class="flex gap-1.5 text-xs font-bold">
        <button onclick="setFilterStatus('semua', this)" class="filter-tab flex-1 py-2 rounded-lg bg-emerald-600 text-white">Semua</button>
        <button onclick="setFilterStatus('belum', this)" class="filter-tab flex-1 py-2 rounded-lg bg-white text-slate-600 border border-slate-200">Belum Lunas</button>
        <button onclick="setFilterStatus('lunas', this)" class="filter-tab flex-1 py-2 rounded-lg bg-white text-slate-600 border border-slate-200">Lunas</button>
      </div>
    </div>

    <!-- Daftar Warga -->
    <div id="listWarga" class="space-y-2.5">
      <div class="text-center py-10 text-slate-500 text-sm">Memuat data warga dari Spreadsheet...</div>
    </div>
  </main>

  <!-- Modal Input Setoran -->
  <div id="modalInput" class="fixed inset-0 bg-slate-900/60 z-20 hidden items-end justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl p-5 pb-7 max-h-[92vh] overflow-y-auto animate-slide-up shadow-2xl">
      
      <div class="flex justify-between items-start mb-3">
        <div>
          <span id="mNoRumah" class="text-xs font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">BLOK A-01</span>
          <h2 id="mNamaWarga" class="text-xl font-bold mt-1">Nama Warga</h2>
        </div>
        <button onclick="tutupModal('modalInput')" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 font-bold flex items-center justify-center">✕</button>
      </div>

      <!-- Info Sisa Kekurangan -->
      <div id="mInfoSaldo" class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-700 leading-relaxed mb-4"></div>

      <!-- Input 1: Uang Sampah (Target 15k) -->
      <div class="mb-4">
        <div class="flex justify-between items-center mb-2">
          <label class="text-sm font-bold text-slate-800">1. Uang Sampah (Target Rp15.000)</label>
          <button type="button" id="btnLunasiSampah" onclick="isiSisaSampah()" class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded-md">Isi Sisa</button>
        </div>
        <div class="grid grid-cols-4 gap-2 mb-2" id="chipsSampah">
          <button type="button" onclick="pilihSampah(0, this)" class="chip-btn py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white">Rp0</button>
          <button type="button" onclick="pilihSampah(3000, this)" class="chip-btn py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white">3rb (1m)</button>
          <button type="button" onclick="pilihSampah(6000, this)" class="chip-btn py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white">6rb (2m)</button>
          <button type="button" onclick="pilihSampah(15000, this)" class="chip-btn py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white">15rb (Lunas)</button>
        </div>
        <input
          type="number"
          id="inputSampah"
          oninput="updatePreview()"
          placeholder="Ketik nominal cicilan sampah..."
          class="w-full px-3.5 py-3 border border-slate-300 rounded-xl text-lg font-bold focus:outline-none focus:border-emerald-600"
        />
      </div>

      <!-- Input 2: Uang Perelek (Target 10k) -->
      <div class="mb-4">
        <div class="flex justify-between items-center mb-2">
          <label class="text-sm font-bold text-slate-800">2. Uang Perelek (Target Rp10.000)</label>
          <button type="button" id="btnLunasiPerelek" onclick="isiSisaPerelek()" class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded-md">Isi Sisa</button>
        </div>
        <div class="grid grid-cols-4 gap-2 mb-2" id="chipsPerelek">
          <button type="button" onclick="pilihPerelek(0, this)" class="chip-btn py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white">Rp0</button>
          <button type="button" onclick="pilihPerelek(2000, this)" class="chip-btn py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white">2rb (1m)</button>
          <button type="button" onclick="pilihPerelek(5000, this)" class="chip-btn py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white">5rb</button>
          <button type="button" onclick="pilihPerelek(10000, this)" class="chip-btn py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white">10rb (Lunas)</button>
        </div>
        <input
          type="number"
          id="inputPerelek"
          oninput="updatePreview()"
          placeholder="Ketik nominal cicilan perelek..."
          class="w-full px-3.5 py-3 border border-slate-300 rounded-xl text-lg font-bold focus:outline-none focus:border-emerald-600"
        />
      </div>

      <!-- Preview Kalkulasi -->
      <div id="previewBox" class="bg-blue-50 border border-blue-200 text-blue-900 rounded-xl p-3 text-xs leading-relaxed mb-4">
        Total uang diterima: <b>Rp0</b>
      </div>

      <button
        id="btnSimpan"
        onclick="kirimData()"
        class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold rounded-xl text-base shadow-md transition disabled:bg-slate-400"
      >
        Simpan Setoran
      </button>

      <!-- Hapus Warga Pindah -->
      <div class="mt-6 pt-4 border-t border-slate-200 text-center">
        <button
          id="btnHapusWarga"
          type="button"
          onclick="hapusWargaPindah()"
          class="text-xs font-semibold text-red-600 hover:text-red-700 py-2 px-3 rounded-lg hover:bg-red-50 transition"
        >
          🗑️ Hapus Warga Ini (Pindah Rumah)
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Riwayat Transaksi Hari Ini -->
  <div id="modalRiwayat" class="fixed inset-0 bg-slate-900/60 z-20 hidden items-end justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl p-5 pb-7 max-h-[85vh] overflow-y-auto animate-slide-up shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 class="text-lg font-bold">Riwayat Input Hari Ini</h2>
          <p class="text-xs text-slate-500">Hapus transaksi jika ada yang salah nominal/warga</p>
        </div>
        <button onclick="tutupModal('modalRiwayat')" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 font-bold flex items-center justify-center">✕</button>
      </div>
      <div id="listRiwayat" class="space-y-2.5 mt-3"></div>
    </div>
  </div>

  <!-- Toast Notifikasi Bawah -->
  <div id="toastBox" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white px-4 py-3.5 rounded-2xl shadow-xl hidden justify-between items-center z-30">
    <span id="toastText" class="text-xs font-medium pr-2">Tersimpan!</span>
    <div class="flex items-center gap-2 shrink-0">
      <a id="btnWaLink" href="#" target="_blank" class="hidden bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Kirim WA</a>
      <button id="btnUndoToast" type="button" onclick="batalkanTerakhir()" class="bg-red-500 hover:bg-red-600 disabled:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Batalkan</button>
      <button type="button" onclick="tutupToast()" aria-label="Tutup notifikasi" class="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-xs flex items-center justify-center">✕</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // TEMPEL LINK WEB APP APPS SCRIPT (/exec) KAMU DI DALAM TANDA KUTIP DI BAWAH:
    const API_URL = "https://script.google.com/macros/s/AKfycbypWK-8z3f3hF1RVSXeQfsGKchrY51lldFqjmZtiLHA4rFsvCB_A-HMWR3tK-fOSnQI/exec";
    // =========================================================================

    const TARGET_SAMPAH = 15000;
    const TARGET_PERELEK = 10000;
    let semuaWarga = [];
    let logHariIni = [];
    let wargaAktif = null;
    let lastTrxId = null;
    let statusFilter = "semua";
    let toastTimer = null;

    function formatRp(angka) {
      return "Rp" + Number(angka || 0).toLocaleString("id-ID");
    }

    function tutupToast() {
      const toast = document.getElementById("toastBox");
      toast.classList.add("hidden");
      toast.classList.remove("flex");
      if (toastTimer) clearTimeout(toastTimer);
    }

    function tampilkanToast() {
      const toast = document.getElementById("toastBox");
      const btnUndo = document.getElementById("btnUndoToast");
      btnUndo.disabled = false;
      btnUndo.innerText = "Batalkan";

      toast.classList.remove("hidden");
      toast.classList.add("flex");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        tutupToast();
      }, 10000);
    }

    // Helper khusus mengirim POST ke Google Apps Script agar aman dari CORS Redirect
    async function postAppsScript(payloadObj) {
      const res = await fetch(API_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payloadObj)
      });
      return await res.json();
    }

    async function muatData() {
      const container = document.getElementById("listWarga");
      try {
        const res = await fetch(API_URL + "?t=" + Date.now(), { redirect: "follow" });
        const data = await res.json();
        if (data.status === "sukses") {
          semuaWarga = (data.warga || []).map(w => {
            const sisaSampah = Math.max(0, TARGET_SAMPAH - (Number(w.totalSampah) || 0));
            const sisaPerelek = Math.max(0, TARGET_PERELEK - (Number(w.totalPerelek) || 0));
            return {
              ...w,
              sisaSampah,
              sisaPerelek,
              isLunas: sisaSampah === 0 && sisaPerelek === 0
            };
          });
          logHariIni = data.logHariIni || [];
          document.getElementById("kasHariIni").innerText = formatRp(data.kasHariIni);
          document.getElementById("countLog").innerText = logHariIni.length;
          filterWarga();
          renderRiwayat();
        } else {
          container.innerHTML = `<div class="text-center py-8 text-red-600 text-sm">Gagal memuat data dari Spreadsheet.</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="text-center py-8 text-red-600 text-sm">Koneksi gagal. Pastikan API_URL sudah diisi dengan benar.</div>`;
      }
    }

    function setFilterStatus(status, btn) {
      statusFilter = status;
      document.querySelectorAll(".filter-tab").forEach(el => {
        el.classList.remove("bg-emerald-600", "text-white");
        el.classList.add("bg-white", "text-slate-600", "border", "border-slate-200");
      });
      btn.classList.remove("bg-white", "text-slate-600", "border", "border-slate-200");
      btn.classList.add("bg-emerald-600", "text-white");
      filterWarga();
    }

    function filterWarga() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = semuaWarga.filter(w => {
        const matchText = w.nama.toLowerCase().includes(q) || w.noRumah.toLowerCase().includes(q);
        if (statusFilter === "lunas") return matchText && w.isLunas;
        if (statusFilter === "belum") return matchText && !w.isLunas;
        return matchText;
      });
      renderWarga(filtered);
    }

    function renderWarga(list) {
      const container = document.getElementById("listWarga");
      if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Tidak ada warga pada kategori ini.</div>`;
        return;
      }

      container.innerHTML = list.map(w => {
        const totalKurang = w.sisaSampah + w.sisaPerelek;
        let badgeText = "";
        let badgeStyle = "";

        if (w.isLunas || totalKurang <= 0) {
          badgeText = "✅ LUNAS";
          badgeStyle = "bg-emerald-100 text-emerald-800 border-emerald-200";
        } else if ((Number(w.totalSampah) || 0) === 0 && (Number(w.totalPerelek) || 0) === 0) {
          badgeText = "Belum Bayar";
          badgeStyle = "bg-red-100 text-red-700 border-red-200";
        } else {
          badgeText = `Kurang ${formatRp(totalKurang)}`;
          badgeStyle = "bg-amber-100 text-amber-800 border-amber-200";
        }

        return `
          <div onclick="bukaModalById('${w.id}')" class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center active:scale-[0.98] transition cursor-pointer">
            <div>
              <div class="font-bold text-base text-slate-900">${w.noRumah} — ${w.nama}</div>
              <div class="text-xs text-slate-500 mt-0.5">
                Sampah: <b>${formatRp(w.totalSampah)}</b>/15rb • Perelek: <b>${formatRp(w.totalPerelek)}</b>/10rb
              </div>
            </div>
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${badgeStyle} text-right shrink-0 ml-2">
              ${badgeText}
            </span>
          </div>
        `;
      }).join("");
    }

    function bukaModalById(id) {
      const w = semuaWarga.find(item => item.id === id);
      if (!w) return;
      wargaAktif = w;

      document.getElementById("mNoRumah").innerText = `${w.noRumah} • ID: ${w.id}`;
      document.getElementById("mNamaWarga").innerText = w.nama;

      document.getElementById("mInfoSaldo").innerHTML = `
        <div class="flex justify-between mb-1">
          <span>Sampah Masuk: <b>${formatRp(w.totalSampah)}</b> / Rp15.000</span>
          <span class="${w.sisaSampah === 0 ? 'text-emerald-700 font-bold' : 'text-amber-700 font-bold'}">
            ${w.sisaSampah === 0 ? 'Lunas' : 'Kurang ' + formatRp(w.sisaSampah)}
          </span>
        </div>
        <div class="flex justify-between">
          <span>Perelek Masuk: <b>${formatRp(w.totalPerelek)}</b> / Rp10.000</span>
          <span class="${w.sisaPerelek === 0 ? 'text-emerald-700 font-bold' : 'text-amber-700 font-bold'}">
            ${w.sisaPerelek === 0 ? 'Lunas' : 'Kurang ' + formatRp(w.sisaPerelek)}
          </span>
        </div>
      `;

      document.getElementById("btnLunasiSampah").style.display = w.sisaSampah > 0 ? "inline-block" : "none";
      document.getElementById("btnLunasiSampah").innerText = `Isi Sisa (${formatRp(w.sisaSampah)})`;

      document.getElementById("btnLunasiPerelek").style.display = w.sisaPerelek > 0 ? "inline-block" : "none";
      document.getElementById("btnLunasiPerelek").innerText = `Isi Sisa (${formatRp(w.sisaPerelek)})`;

      document.getElementById("inputSampah").value = "";
      document.getElementById("inputPerelek").value = "";
      resetChipStyles();
      updatePreview();

      const modal = document.getElementById("modalInput");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function tutupModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function resetChipStyles() {
      document.querySelectorAll(".chip-btn").forEach(b => {
        b.classList.remove("border-emerald-600", "bg-emerald-50", "text-emerald-800");
        b.classList.add("border-slate-300", "bg-white");
      });
    }

    function isiSisaSampah() {
      if (!wargaAktif) return;
      document.getElementById("inputSampah").value = wargaAktif.sisaSampah;
      updatePreview();
    }

    function isiSisaPerelek() {
      if (!wargaAktif) return;
      document.getElementById("inputPerelek").value = wargaAktif.sisaPerelek;
      updatePreview();
    }

    function pilihSampah(nominal, btn) {
      document.querySelectorAll("#chipsSampah .chip-btn").forEach(b => {
        b.classList.remove("border-emerald-600", "bg-emerald-50", "text-emerald-800");
        b.classList.add("border-slate-300", "bg-white");
      });
      btn.classList.remove("border-slate-300", "bg-white");
      btn.classList.add("border-emerald-600", "bg-emerald-50", "text-emerald-800");
      document.getElementById("inputSampah").value = nominal;
      updatePreview();
    }

    function pilihPerelek(nominal, btn) {
      document.querySelectorAll("#chipsPerelek .chip-btn").forEach(b => {
        b.classList.remove("border-emerald-600", "bg-emerald-50", "text-emerald-800");
        b.classList.add("border-slate-300", "bg-white");
      });
      btn.classList.remove("border-slate-300", "bg-white");
      btn.classList.add("border-emerald-600", "bg-emerald-50", "text-emerald-800");
      document.getElementById("inputPerelek").value = nominal;
      updatePreview();
    }

    function updatePreview() {
      const sampah = Number(document.getElementById("inputSampah").value) || 0;
      const perelek = Number(document.getElementById("inputPerelek").value) || 0;
      const total = sampah + perelek;

      const sisaSampahBaru = Math.max(0, (wargaAktif ? wargaAktif.sisaSampah : 0) - sampah);
      const sisaPerelekBaru = Math.max(0, (wargaAktif ? wargaAktif.sisaPerelek : 0) - perelek);

      let statusBaru = "";
      if (total > 0) {
        if (sisaSampahBaru === 0 && sisaPerelekBaru === 0) {
          statusBaru = `<br><span class="text-emerald-700 font-bold">✅ Setelah simpan, iuran warga ini LUNAS 100%!</span>`;
        } else {
          statusBaru = `<br>Sisa setelah simpan: Sampah <b>${formatRp(sisaSampahBaru)}</b> • Perelek <b>${formatRp(sisaPerelekBaru)}</b>`;
        }
      }

      document.getElementById("previewBox").innerHTML = `
        Total uang diterima: <b class="text-sm">${formatRp(total)}</b>
        ${statusBaru}
      `;
    }

    async function kirimData() {
      const sampah = Number(document.getElementById("inputSampah").value) || 0;
      const perelek = Number(document.getElementById("inputPerelek").value) || 0;

      if (sampah + perelek <= 0) {
        alert("Isi nominal Sampah atau Perelek terlebih dahulu!");
        return;
      }

      const btn = document.getElementById("btnSimpan");
      btn.disabled = true;
      btn.innerText = "Menyimpan ke Spreadsheet...";

      // Buat ID unik langsung di client agar pasti sinkron saat dibatalkan
      const clientTrxId = "TRX-" + Date.now();

      try {
        const data = await postAppsScript({
          idTransaksi: clientTrxId,
          idWarga: wargaAktif.id,
          noRumah: wargaAktif.noRumah,
          namaWarga: wargaAktif.nama,
          sampah: sampah,
          perelek: perelek
        });

        if (data.status === "sukses") {
          tutupModal("modalInput");
          lastTrxId = data.idTransaksi || clientTrxId;

          const waBtn = document.getElementById("btnWaLink");
          if (wargaAktif.noWa) {
            const pesan = `Terima kasih *${wargaAktif.nama}* (${wargaAktif.noRumah}), pembayaran kas RT telah dicatat:\n- Sampah: ${formatRp(sampah)}\n- Perelek: ${formatRp(perelek)}\n- Total: *${formatRp(data.totalBayar)}*\nWaktu: ${data.waktu}`;
            waBtn.href = `https://wa.me/${wargaAktif.noWa}?text=${encodeURIComponent(pesan)}`;
            waBtn.classList.remove("hidden");
          } else {
            waBtn.classList.add("hidden");
          }

          document.getElementById("toastText").innerText = `Tersimpan ${formatRp(data.totalBayar)} (${wargaAktif.nama})`;
          tampilkanToast();

          await muatData();
        } else {
          alert("Gagal menyimpan: " + (data.pesan || "Error"));
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan saat menyimpan: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Simpan Setoran";
      }
    }

    async function batalkanTerakhir() {
      if (!lastTrxId) return;
      const btnUndo = document.getElementById("btnUndoToast");
      btnUndo.disabled = true;
      btnUndo.innerText = "Menghapus...";
      if (toastTimer) clearTimeout(toastTimer);

      try {
        const data = await postAppsScript({
          action: "hapus_transaksi",
          idTransaksi: lastTr
